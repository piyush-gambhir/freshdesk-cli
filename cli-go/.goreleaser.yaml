version: 2
project_name: freshdesk-cli
builds:
  - binary: freshdesk
    dir: cli-go
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/piyush-gambhir/freshdesk-cli/cli-go/internal/build.Version={{.Version}}
      - -X github.com/piyush-gambhir/freshdesk-cli/cli-go/internal/build.Commit={{.Commit}}
      - -X github.com/piyush-gambhir/freshdesk-cli/cli-go/internal/build.Date={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
sboms:
  - artifacts: archive
checksum:
  name_template: checksums.txt
release:
  name_template: "Freshdesk CLI {{ .Tag }}"
  draft: true
  replace_existing_draft: true
  prerelease: auto
  footer: |
    Documentation coverage and fixture tests do not replace live Freshdesk tenant verification.

    Made by gpt-6.1-sol in Codex
changelog:
  sort: asc
